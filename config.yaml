# 默认 config.yaml；可用 -config 指定其他路径，也可用 MEMABLE_* 环境变量覆盖。
# 所有路径均支持相对路径（相对于工作目录）。

server:
  port: 12358              # HTTP 监听端口。被占用时自动 +1 避让（最多试 20 个端口）；
                           # 0=随机空闲端口；也可用 -port flag 或 MEMABLE_SERVER__PORT 覆盖。
                           # 实际端口见启动日志或 /api/settings 的 server_port。

#database:
#  path: memable.db          # SQLite 数据库文件路径；":memory:" 为内存库。
                            # 注释掉/留空时默认系统数据目录：
                            #   Windows: %LOCALAPPDATA%\memable\memable.db
                            #   macOS:   ~/Library/Application Support/memable/memable.db
                            #   Linux:   $XDG_DATA_HOME（默认 ~/.local/share）/memable/memable.db
                            # 切换后原位置的存量 memable.db 需手动迁移。

thumbnail:
  # 图片缩略图根目录：留空使用系统数据目录
  #   Windows: %LOCALAPPDATA%\memable\thumbnails\image
  #   macOS:   ~/Library/Application Support/memable/thumbnails/image
  #   Linux:   $XDG_DATA_HOME（默认 ~/.local/share）/memable/thumbnails/image
  # 配置后则使用配置值（相对路径相对于工作目录）。
  # 旧版默认在系统缓存目录，升级后请手动迁移：
  #   Windows %LOCALAPPDATA%\memable\thumbnails、macOS ~/Library/Caches/memable/thumbnails、
  #   Linux $XDG_CACHE_HOME（默认 ~/.cache）/memable/thumbnails
  #   整体移到上述数据目录（或直接配置 image_dir/video_dir 指向旧位置）。
#  image_dir: ""
  # 视频封面根目录：规则同上，video 子目录。
#  video_dir: ""
  max_edge: 400                 # 缩略图最大边（像素）

video:
  sprite_frames: 25             # 5%-95% 区间临时截图数量，计算后清理

similarity:
  image_phash_distance: 6      # 图片 pHash 最大 Hamming 距离
  image_dhash_distance: 10      # 图片 dHash 最大 Hamming 距离
  image_ahash_distance: 10      # 图片 aHash 最大 Hamming 距离
  video_phash_distance: 10      # 视频 sprite pHash 最大 Hamming 距离
  video_duration_diff_ms: 3000  # 视频允许时长差（毫秒）

worker:
  pool_size: 8             # 并发数：SSD/NVMe 建议 16-32，机械硬盘 4-8（并发过高反而寻道抖动）

delete:
  permanent: true          # true=永久删除源文件；false=默认移入系统回收站

ui:
  default_page_size: 20     # 重复报告分组页默认每页组数
  page_size_options: [10, 20, 50, 100]

log:
  level: info               # debug/info/warn/error
  format: text              # text/json
  file: ""                  # 可选：日志文件路径（留空输出到控制台）
